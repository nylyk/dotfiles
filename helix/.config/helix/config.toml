theme = "custom"

[editor]
color-modes = true
shell = ["fish", "-c"]
bufferline = "always"
cursorline = true
line-number = "relative"
scroll-lines = 5
mouse = false

[editor.soft-wrap]
enable = true

[editor.statusline]
left = ["mode", "spinner", "read-only-indicator", "file-modification-indicator", "version-control"]
center = ["diagnostics", "file-name"]
right = ["workspace-diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"]
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false
git-ignore = false

[editor.indent-guides]
render = true
character = "▏"

[keys.normal.space]
t = ":toggle soft-wrap.enable"
