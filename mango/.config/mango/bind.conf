################ Session / system ################
bind=SUPER+SHIFT+CTRL,r,reload_config
bind=SUPER+CTRL,r,spawn,~/.config/mango/reload-waybar-swaybg.sh

################ Launchers ################
bind=SUPER,q,spawn,foot
bind=SUPER,r,spawn,foot --app-id foot_floating
bind=SUPER,d,spawn,fuzzel

################ Media keys ################
bind=NONE,code:122,spawn,wpctl set-volume @DEFAULT_SINK@ 2%-
bind=NONE,code:123,spawn,wpctl set-volume @DEFAULT_SINK@ 2%+
bind=NONE,code:121,spawn,playerctl --player=spotify play-pause
bind=NONE,XF86AudioPlay,spawn,playerctl --player=spotify play-pause
bind=NONE,XF86AudioNext,spawn,playerctl --player=spotify next
bind=NONE,XF86AudioPrev,spawn,playerctl --player=spotify previous

bind=SUPER+CTRL,t,spawn_shell,playerctl -p spotify metadata --format '{{artist}} - {{title}}' | tr -d '\n' | wl-copy
bind=SUPER+CTRL,a,spawn_shell,playerctl -p spotify metadata --format '{{xesam:album}}' | tr -d '\n' | wl-copy

################ Screenshots ################
bind=NONE,Print,spawn_shell,g=$(slurp -d) && [ -n "$g" ] && grim -g "$g" - | tee /storage/tmp/latest_screenshot.png | wl-copy --type image/png
bind=SUPER,Print,spawn_shell,g=$(slurp -o) && [ -n "$g" ] && grim -g "$g" - | tee /storage/tmp/latest_screenshot.png | wl-copy --type image/png

################ Window state ################
bind=SUPER,c,killclient
bind=SUPER,f,togglefullscreen
bind=SUPER,v,togglefloating
bind=SUPER,tab,togglejump

################ Focus a window (SUPER) ################
bind=SUPER,left,focusdir,left
bind=SUPER,right,focusdir,right
bind=SUPER,up,focusdir,up
bind=SUPER,down,focusdir,down

################ Move a window in-layout (SUPER+SHIFT) ################
bind=SUPER+SHIFT,left,exchange_client,left
bind=SUPER+SHIFT,right,exchange_client,right
bind=SUPER+SHIFT,up,exchange_client,up
bind=SUPER+SHIFT,down,exchange_client,down

################ Resize a window (SUPER+ALT) ################
bind=SUPER+ALT,left,resizewin,-50,+0
bind=SUPER+ALT,right,resizewin,+50,+0
bind=SUPER+ALT,up,resizewin,+0,-50
bind=SUPER+ALT,down,resizewin,+0,+50

################ Monitors ################
bind=SUPER+CTRL,left,focusmon,left
bind=SUPER+CTRL,right,focusmon,right
bind=SUPER+CTRL,up,focusmon,up
bind=SUPER+CTRL,down,focusmon,down

bind=SUPER+CTRL+SHIFT,left,tagmon,left
bind=SUPER+CTRL+SHIFT,right,tagmon,right
bind=SUPER+CTRL+SHIFT,up,tagmon,up
bind=SUPER+CTRL+SHIFT,down,tagmon,down

################ Tags: view (SUPER) / send window (SUPER+SHIFT) ################
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

################ Mouse ################
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
